<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTPGET - Virtual Numbers Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-6 text-center shadow-lg">
        <h1 class="text-3xl font-bold italic">OTPGET PAKISTAN</h1>
        <p class="mt-2 text-sm opacity-80">Get Instant OTP for WhatsApp, Telegram & More</p>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-lg mx-auto">
        
        <!-- Profit Calculator Info -->
        <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-3 mb-4 text-xs">
            <strong>Note:</strong> All prices are in PKR. Automatic 20% profit added to API rates.
        </div>

        <!-- Search Bar -->
        <div class="mb-4">
            <input type="text" id="searchBox" placeholder="Search Service (e.g. WhatsApp)" 
            class="w-full p-3 rounded-lg border shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Services List -->
        <div id="servicesContainer" class="space-y-3">
            <p class="text-center py-10 text-gray-500">Loading services from OTPGET...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-8 text-gray-400 text-xs">
        &copy; 2024 OTPGET Store <br> 
        Developer: +923486175620
    </footer>

    <script>
        const API_KEY = '5e1dpaoypy3krh2apmws4qmfaeczbe5b';
        const WHATSAPP_NUMBER = '923486175620';
        const PROFIT_MARGIN = 1.25; // Yani 25% profit aapka

        async function fetchServices() {
            try {
                // OTPGET API call (Prices/Services)
                // Note: Agar CORS error aaye to hum proxy use karenge
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://otpget.com/stubs/handler_api.php?api_key=' + API_KEY + '&action=getPrices&country=0')}`);
                const data = await response.json();
                const prices = JSON.parse(data.contents);

                const container = document.getElementById('servicesContainer');
                container.innerHTML = '';

                // List filter and display (Showing first 50 for speed)
                let count = 0;
                for (let serviceCode in prices[0]) {
                    if(count > 50) break;

                    const serviceData = prices[0][serviceCode];
                    const originalPrice = Object.values(serviceData)[0]; // Get first price
                    const salePrice = Math.round(originalPrice * PROFIT_MARGIN);

                    const div = document.createElement('div');
                    div.className = "bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center";
                    div.innerHTML = `
                        <div>
                            <h3 class="font-bold text-gray-800 uppercase">${serviceCode}</h3>
                            <p class="text-xs text-green-600 font-semibold italic">Stock: Available</p>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-bold text-indigo-700">Rs. ${salePrice}</p>
                            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=Hi, I want to buy ${serviceCode} for Rs.${salePrice}" 
                               class="bg-green-500 text-white px-3 py-1 rounded-md text-sm font-medium hover:bg-green-600">
                               <i class="fab fa-whatsapp"></i> Buy
                            </a>
                        </div>
                    `;
                    container.appendChild(div);
                    count++;
                }

            } catch (error) {
                console.error(error);
                document.getElementById('servicesContainer').innerHTML = "<p class='text-red-500 text-center'>Error loading API. Please check your API key or connection.</p>";
            }
        }

        // Search logic
        document.getElementById('searchBox').addEventListener('input', function(e) {
            let filter = e.target.value.toUpperCase();
            let items = document.getElementById('servicesContainer').getElementsByTagName('div');
            for (let i = 0; i < items.length; i++) {
                let txtValue = items[i].textContent || items[i].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    items[i].style.display = "";
                } else {
                    items[i].style.display = "none";
                }
            }
        });

        fetchServices();
    </script>
</body>
        </html>
