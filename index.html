<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTPGET Store | Buy Virtual Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-blue { background-color: #007bff; transition: 0.3s; }
        .btn-blue:hover { background-color: #0056b3; }
        .dashboard-card { border-radius: 8px; border: 1px solid #e3e6f0; background: #fff; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1); }
        .shimmer { background: linear-gradient(90deg, #eff1f3 25%, #e2e7ed 50%, #eff1f3 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <!-- Top Blue Header (Exactly like your SS) -->
    <div class="w-full bg-[#0052ff] p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center text-white">
            <div class="flex items-center gap-2">
                <i class="fa fa-bars text-xl opacity-70"></i>
                <h1 class="text-xl font-bold tracking-tight uppercase">OTPGET</h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-[#6f42c1] text-[10px] px-2 py-1 rounded font-bold uppercase">PKR</span>
                <span class="text-sm font-semibold">Rs. Store Live</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=fff&color=0052ff" class="w-8 h-8 rounded-full border-2 border-white">
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto p-4 lg:p-8">
        
        <!-- Welcome Banner -->
        <div class="bg-gradient-to-r from-[#0052ff] to-[#00a2ff] rounded-xl p-6 mb-8 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <p class="opacity-80 text-sm">Welcome:</p>
                <h2 class="text-2xl font-bold mb-4">OTPGET Store Front</h2>
                <div class="inline-block bg-white/20 px-4 py-2 rounded-lg border border-white/30 backdrop-blur-md">
                    <p class="text-[10px] uppercase font-bold opacity-80">Profit Margin</p>
                    <p class="text-lg font-bold">Automatic +30% Added</p>
                </div>
            </div>
            <i class="fa fa-circle-nodes absolute -right-10 -bottom-10 text-white/10 text-[200px]"></i>
        </div>

        <!-- Action Buttons (Quick Actions) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <button class="btn-blue text-white text-[11px] py-3 rounded-lg font-bold shadow-sm uppercase">Recieve SMS</button>
            <button class="btn-blue text-white text-[11px] py-3 rounded-lg font-bold shadow-sm uppercase opacity-80">Numbers Prices</button>
            <button class="btn-blue text-white text-[11px] py-3 rounded-lg font-bold shadow-sm uppercase opacity-80">Rent Numbers</button>
            <a href="https://wa.me/923486175620" class="btn-blue text-white text-[11px] py-3 rounded-lg font-bold shadow-sm uppercase text-center">Add Balance</a>
        </div>

        <!-- Search Section -->
        <div class="dashboard-card p-4 mb-6">
            <div class="flex items-center gap-3 border rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-blue-500 transition-all">
                <i class="fa fa-search text-gray-400"></i>
                <input type="text" id="searchBox" placeholder="Search service (e.g WhatsApp, Google, Telegram)..." class="w-full outline-none text-sm bg-transparent">
            </div>
        </div>

        <!-- Numbers List -->
        <div id="servicesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Loading Skeletons -->
            <div class="shimmer h-24 rounded-lg"></div>
            <div class="shimmer h-24 rounded-lg"></div>
            <div class="shimmer h-24 rounded-lg"></div>
            <div class="shimmer h-24 rounded-lg"></div>
        </div>
    </div>

    <script>
        const API_KEY = '5e1dpaoypy3krh2apmws4qmfaeczbe5b';
        const WHATSAPP_NUMBER = '923486175620';
        const PROFIT_PERCENT = 30;

        async function loadStore() {
            const container = document.getElementById('servicesContainer');
            
            try {
                // Using a more reliable CORS Proxy
                const targetUrl = `https://otpget.com/stubs/handler_api.php?api_key=${API_KEY}&action=getPrices&country=0`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl);
                const json = await response.json();
                
                // If AllOrigins failed or returned null
                if (!json.contents) throw new Error("CORS Proxy Failed");
                
                const allData = JSON.parse(json.contents);
                const services = allData["0"] || allData;

                container.innerHTML = '';
                
                // Show first 150 services
                Object.keys(services).slice(0, 150).forEach(key => {
                    const priceData = services[key];
                    const basePrice = Object.values(priceData)[0];
                    const salePrice = Math.ceil(basePrice * (1 + PROFIT_PERCENT/100));

                    const card = document.createElement('div');
                    card.className = "dashboard-card p-4 flex justify-between items-center hover:scale-[1.02] transition-transform cursor-default";
                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-gray-100 rounded flex items-center justify-center text-blue-600 font-bold border">
                                <i class="fa fa-sms opacity-50"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-700 uppercase tracking-tighter">${key}</h4>
                                <span class="text-[9px] text-green-600 font-bold bg-green-50 px-2 py-0.5 rounded">ONLINE</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-lg font-bold text-gray-800 leading-none">Rs. ${salePrice}</p>
                            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=I want to buy ${key.toUpperCase()} for Rs.${salePrice}" 
                               class="inline-block mt-2 bg-[#0052ff] text-white text-[9px] font-bold px-4 py-1.5 rounded uppercase shadow-sm active:opacity-80">
                               BUY NOW
                            </a>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="col-span-full text-center py-10">
                        <i class="fa fa-exclamation-triangle text-orange-400 text-3xl mb-3"></i>
                        <p class="text-gray-600 text-sm font-semibold">Connection Timeout. OTPGET server is busy.</p>
                        <button onclick="window.location.reload()" class="mt-4 bg-[#0052ff] text-white px-6 py-2 rounded-lg text-xs font-bold uppercase shadow-md">Try Again</button>
                    </div>
                `;
            }
        }

        // Fast Search logic
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#servicesContainer > div');
            cards.forEach(card => {
                const title = card.querySelector('h4').innerText.toLowerCase();
                card.style.display = title.includes(val) ? 'flex' : 'none';
            });
        });

        // Initialize Store
        document.addEventListener('DOMContentLoaded', loadStore);
    </script>
</body>
</html>
