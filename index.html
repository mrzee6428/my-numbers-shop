<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTPGET PK | Instant Virtual Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .card-anim { transition: all 0.2s ease; }
        .card-anim:active { transform: scale(0.96); }
        .shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-nav px-5 py-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i class="fa fa-bolt text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">OTPGET<span class="text-indigo-600">PK</span></h1>
            </div>
            <div class="flex items-center gap-1.5 bg-emerald-50 px-3 py-1 rounded-full border border-emerald-100">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-[10px] font-bold text-emerald-700 uppercase">Server Active</span>
            </div>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-5 pb-32">
        <!-- Hero Banner -->
        <div class="relative bg-indigo-600 rounded-3xl p-7 mb-8 overflow-hidden shadow-2xl shadow-indigo-100">
            <div class="relative z-10">
                <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-[0.2em] mb-1">Premium Store</p>
                <h2 class="text-white text-2xl font-extrabold leading-tight">Instant SMS OTP <br> Delivery</h2>
                <p class="text-indigo-100/80 text-xs mt-2 font-medium">WhatsApp, Telegram, Google & 500+</p>
            </div>
            <i class="fa fa-mobile-screen absolute -bottom-6 -right-6 text-white/10 text-[120px] transform -rotate-12"></i>
        </div>

        <!-- Search Bar -->
        <div class="relative mb-8">
            <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchBox" placeholder="Search service (e.g. WhatsApp)" 
            class="w-full pl-12 pr-5 py-4 rounded-2xl bg-white border-0 shadow-sm ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-600 outline-none transition-all text-sm font-medium">
        </div>

        <div class="flex justify-between items-center mb-5 px-1">
            <h3 class="text-slate-800 font-extrabold text-sm flex items-center gap-2">
                <i class="fa fa-star text-amber-500"></i> Available Services
            </h3>
            <span id="serviceCount" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">Loading...</span>
        </div>

        <!-- Dynamic Content -->
        <div id="servicesContainer" class="grid gap-3">
            <!-- Loading Skeletons -->
            <div class="shimmer h-24 rounded-2xl"></div>
            <div class="shimmer h-24 rounded-2xl"></div>
            <div class="shimmer h-24 rounded-2xl"></div>
            <div class="shimmer h-24 rounded-2xl"></div>
        </div>
    </main>

    <!-- Support Floating Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-5 bg-white/80 backdrop-blur-xl border-t border-slate-100 z-50">
        <div class="max-w-md mx-auto">
            <a href="https://wa.me/923486175620" class="flex items-center justify-center gap-3 bg-slate-900 text-white w-full py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">
                <i class="fab fa-whatsapp text-xl text-emerald-400"></i>
                Message Admin
            </a>
        </div>
    </div>

    <script>
        const API_KEY = '5e1dpaoypy3krh2apmws4qmfaeczbe5b';
        const WHATSAPP_NUMBER = '923486175620';
        const PROFIT_MARGIN = 1.30; // 30% Profit add kiya hai

        async function initApp() {
            const container = document.getElementById('servicesContainer');
            const countLabel = document.getElementById('serviceCount');

            try {
                // Fetching from OTPGET via high-speed proxy
                const apiEndpoint = `https://otpget.com/stubs/handler_api.php?api_key=${API_KEY}&action=getPrices&country=0`;
                const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(apiEndpoint)}`;
                
                const response = await fetch(proxy);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                
                const services = data["0"] || data;
                container.innerHTML = '';
                
                const serviceKeys = Object.keys(services).slice(0, 120); // First 120 items
                countLabel.innerText = `${serviceKeys.length} Services`;

                serviceKeys.forEach(name => {
                    const basePrice = Object.values(services[name])[0];
                    const salePrice = Math.ceil(basePrice * PROFIT_MARGIN);

                    const div = document.createElement('div');
                    div.className = "card-anim bg-white p-5 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100 hover:border-indigo-200 group";
                    div.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center text-indigo-600 font-extrabold text-[10px] uppercase border border-slate-100 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                ${name.substring(0, 2)}
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-800 uppercase text-xs tracking-wide">${name}</h4>
                                <div class="flex items-center gap-1 mt-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    <span class="text-[9px] font-bold text-emerald-600 uppercase">Available</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-slate-400 font-bold mb-0.5 leading-none">Price</p>
                            <p class="text-lg font-black text-slate-900 leading-none">Rs ${salePrice}</p>
                            <a href="https://wa.me/${WHATSAPP_NUMBER}?text=I want to buy ${name.toUpperCase()} (Rs.${salePrice})" 
                               class="text-[9px] font-extrabold text-indigo-600 uppercase mt-2 inline-block tracking-tighter">
                               BUY NOW <i class="fa fa-arrow-right ml-0.5"></i>
                            </a>
                        </div>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-3xl border border-dashed border-slate-200">
                        <i class="fa fa-triangle-exclamation text-slate-300 text-3xl mb-2"></i>
                        <p class="text-slate-500 text-xs font-bold uppercase">Connection Slow</p>
                        <button onclick="window.location.reload()" class="mt-4 bg-indigo-600 text-white text-[10px] font-bold px-5 py-2 rounded-full uppercase tracking-widest shadow-lg shadow-indigo-100">Refresh Store</button>
                    </div>`;
            }
        }

        // Realtime Search Filter
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.card-anim');
            items.forEach(card => {
                const title = card.querySelector('h4').innerText.toLowerCase();
                card.style.display = title.includes(query) ? 'flex' : 'none';
            });
        });

        // Run App
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
    </html>
