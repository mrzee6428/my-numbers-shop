<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTPGET PK - Virtual Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-indigo-800 text-white p-6 text-center shadow-xl">
        <h1 class="text-2xl font-black tracking-tight">OTPGET PAKISTAN</h1>
        <p class="text-indigo-200 text-xs mt-1">Saste aur Fast Virtual Numbers</p>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- Search Box -->
        <div class="relative mb-6">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                <i class="fa fa-search text-gray-400"></i>
            </span>
            <input type="text" id="searchBox" placeholder="Search Service (e.g. WhatsApp)" 
            class="w-full pl-10 p-3 rounded-xl border-none shadow-md focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Notification -->
        <div id="statusBox" class="bg-blue-100 text-blue-700 p-3 rounded-lg text-xs mb-4 text-center">
            <i class="fa fa-sync fa-spin"></i> Fetching latest prices...
        </div>

        <!-- Services Container -->
        <div id="servicesContainer" class="grid grid-cols-1 gap-3">
            <!-- Data will load here -->
        </div>
    </main>

    <script>
        const API_KEY = '5e1dpaoypy3krh2apmws4qmfaeczbe5b';
        const WHATSAPP_NUMBER = '923486175620';
        const PROFIT_PERCENTAGE = 30; // 30% Profit

        async function loadServices() {
            const container = document.getElementById('servicesContainer');
            const statusBox = document.getElementById('statusBox');

            try {
                // Using a different proxy to bypass CORS
                const apiUrl = `https://otpget.com/stubs/handler_api.php?api_key=${API_KEY}&action=getPrices&country=0`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

                const response = await fetch(proxyUrl);
                const data = await response.json();
                const pricesData = JSON.parse(data.contents);

                // Check if we have data for country 0
                const services = pricesData["0"] || pricesData;
                
                statusBox.style.display = 'none';
                container.innerHTML = '';

                let count = 0;
                for (const [name, details] of Object.entries(services)) {
                    if (count > 80) break; // Limit to 80 services for speed

                    // Getting the price (OTPGET usually nested)
                    const cost = Object.values(details)[0]; 
                    const salePrice = Math.round(cost + (cost * PROFIT_PERCENTAGE / 100));

                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center transition-transform active:scale-95";
                    card.innerHTML = `
                        <div>
                            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">${name}</p>
                            <p class="text-lg font-extrabold text-gray-800">Rs. ${salePrice}</p>
                        </div>
                        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=Assalam-o-Alaikum, I want to buy ${name.toUpperCase()} Number for Rs. ${salePrice}" 
                           class="bg-green-500 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md flex items-center gap-2">
                            <i class="fab fa-whatsapp"></i> BUY
                        </a>
                    `;
                    container.appendChild(card);
                    count++;
                }

                if(count === 0) {
                    statusBox.innerHTML = "No services found. Check API key.";
                    statusBox.style.display = 'block';
                }

            } catch (error) {
                console.error(error);
                statusBox.className = "bg-red-100 text-red-700 p-3 rounded-lg text-xs mb-4 text-center";
                statusBox.innerHTML = "Error connecting to server. Please refresh page.";
            }
        }

        // Search Filter
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('#servicesContainer > div');
            cards.forEach(card => {
                const name = card.querySelector('p').innerText.toLowerCase();
                card.style.display = name.includes(term) ? 'flex' : 'none';
            });
        });

        loadServices();
    </script>

</body>
</html>
