<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Numbers Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-6 text-center shadow-lg">
        <h1 class="text-3xl font-bold">Virtual Numbers Shop</h1>
        <p class="mt-2 text-sm text-blue-100">Fast & Secure OTP Services</p>
    </header>

    <!-- Main Content -->
    <main class="p-6 max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Available Services</h2>
            
            <!-- Number List (Sample) -->
            <div class="space-y-4">
                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border">
                    <div>
                        <h3 class="font-bold">WhatsApp USA Number</h3>
                        <p class="text-sm text-gray-500">Available: 10+</p>
                    </div>
                    <div class="text-right">
                        <p class="text-blue-600 font-bold italic">Rs. 250</p>
                        <a href="https://wa.me/923486175620?text=Hi, I want to buy USA WhatsApp number" 
                           class="inline-block mt-2 bg-green-500 text-white px-4 py-1 rounded-full text-xs hover:bg-green-600">Buy on WhatsApp</a>
                    </div>
                </div>

                <div class="flex justify-between items-center bg-gray-50 p-4 rounded-lg border">
                    <div>
                        <h3 class="font-bold">Telegram UK Number</h3>
                        <p class="text-sm text-gray-500">Available: 5</p>
                    </div>
                    <div class="text-right">
                        <p class="text-blue-600 font-bold italic">Rs. 150</p>
                        <a href="https://wa.me/923486175620?text=Hi, I want to buy UK Telegram number" 
                           class="inline-block mt-2 bg-green-500 text-white px-4 py-1 rounded-full text-xs hover:bg-green-600">Buy on WhatsApp</a>
                    </div>
                </div>
            </div>

            <p class="mt-8 text-center text-gray-400 text-xs">More numbers coming soon via API...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-6 text-gray-500 text-sm">
        &copy; 2024 Virtual Number Shop - Built with Love
    </footer>

</body>
  </html>
